name: tests

on:
  push:
  pull_request:

jobs:
  headless-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GODOT_VERSION: "4.7"
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      - name: Import project
        run: timeout 300 godot --headless --path . --import || true
      - name: Fast test suite
        run: timeout 900 godot --headless --path . -s res://tests/run_tests.gd -- --skip-slow
      - name: Benchmarks (informational)
        run: timeout 900 godot --headless --path . -s res://tools/bench.gd -- small medium
